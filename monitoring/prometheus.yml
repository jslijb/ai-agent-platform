global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 主服务 metrics（包含所有服务的调用指标）
  - job_name: "main-service"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: "main"

  # Prometheus 自身
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

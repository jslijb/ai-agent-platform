global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 主服务 metrics（包含所有服务的调用指标）
  - job_name: "main-service"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: "main"

  # RAG 检索服务 metrics
  - job_name: "rag-service"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["host.docker.internal:3001"]
        labels:
          service: "rag"

  # 评估服务 metrics
  - job_name: "evaluation-service"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["host.docker.internal:3003"]
        labels:
          service: "evaluation"

  # 数据服务 metrics
  - job_name: "data-service"
    metrics_path: "/health"
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: "data"

  # Prometheus 自身
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
